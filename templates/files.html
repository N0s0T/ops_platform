{% extends "base.html" %}
{% block content %}
<h3>文件分发</h3>

<div class="card mb-4">
    <div class="card-header">选择主机</div>
    <div class="card-body">
        <div class="mb-2">
            <button class="btn btn-sm btn-outline-primary" onclick="toggleAll()">全选/取消</button>
        </div>
        {% for host in hosts %}
        <div class="form-check">
            <input class="form-check-input host-cb" type="checkbox" value="{{ host.id }}" id="fhost-{{ host.id }}">
            <label class="form-check-label" for="fhost-{{ host.id }}">
                {{ host.name }} ({{ host.hostname }})
            </label>
        </div>
        {% endfor %}
    </div>
</div>

<div class="card mb-4">
    <div class="card-header">上传文件</div>
    <div class="card-body">
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <input type="file" name="file" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="remote_path" class="form-control" value="/tmp" placeholder="远程目录">
                </div>
                <div class="col-md-2">
                    <button id="uploadBtn" type="submit" class="btn btn-primary w-100">分发</button>
                </div>
            </div>
        </form>
    </div>
</div>

<div id="results"></div>

<script>
function toggleAll() {
    document.querySelectorAll('.host-cb').forEach(cb => cb.checked = !cb.checked);
}

document.getElementById('uploadForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var formData = new FormData(this);
    var hostIds = [];
    document.querySelectorAll('.host-cb:checked').forEach(cb => hostIds.push(cb.value));
    if (hostIds.length === 0) { alert('请选择主机'); return; }
    hostIds.forEach(id => formData.append('host_ids', id));

    var btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    btn.textContent = '分发中...';
    document.getElementById('results').innerHTML = '<div class="text-muted">正在分发...</div>';

    fetch('/files/upload', {method: 'POST', body: formData})
    .then(r => r.json())
    .then(data => {
        btn.disabled = false;
        btn.textContent = '分发';
        if (data.code !== 200) { alert(data.msg); return; }
        var html = '<h5 class="mt-3">分发结果</h5>';
        data.data.forEach(r => {
            var color = r.success ? 'success' : 'danger';
            html += '<div class="card mb-2 border-' + color + '">';
            html += '<div class="card-header bg-' + color + ' text-white">';
            html += r.host_name + ' (' + r.hostname + ')</div>';
            html += '<div class="card-body">';
            if (r.success) {
                html += '<span class="text-success">上传成功: ' + r.path + '</span>';
            } else {
                html += '<span class="text-danger">失败: ' + r.error + '</span>';
            }
            html += '</div></div>';
        });
        document.getElementById('results').innerHTML = html;
    });
});
</script>
{% endblock %}
